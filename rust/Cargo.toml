[package]
name = "ttyd"
version = "1.7.7"
edition = "2021"
rust-version = "1.86"
description = "Share your terminal over the web"
license = "MIT"
repository = "https://github.com/tsl0922/ttyd"
default-run = "ttyd"

[[bin]]
name = "ttyd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["ws", "http2"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
http-body-util = "0.1"
bytes = "1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

flate2 = "1"
base64 = "0.22"
subtle = "2"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }

anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
moka = { version = "0.12", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "fs", "user", "net"] }
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "blocking"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
